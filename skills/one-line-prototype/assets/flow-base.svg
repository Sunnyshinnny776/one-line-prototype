<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="868" height="160" viewBox="0 0 868 160" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .bg{fill:#FFFFFF}
      .titlebar{fill:#4A6FA5} .titlet{fill:#fff;font-size:18px;font-weight:700;text-anchor:middle}
      .lane{fill:#F7FAFD;stroke:#C9D6E8;stroke-width:1.2}
      .lanehead{fill:#4A6FA5} .laneheadt{fill:#fff;font-size:14px;font-weight:600;text-anchor:middle}
      .start{fill:#DCEAF9;stroke:#4A6FA5;stroke-width:1.2} .startt{fill:#25395a;font-size:12.5px;text-anchor:middle}
      .n{fill:#7EA6E0;stroke:#4A6FA5;stroke-width:1.2} .nt{fill:#fff;font-size:12.5px;text-anchor:middle}
      .dec{fill:#DCE8F7;stroke:#4A6FA5;stroke-width:1.2} .dect{fill:#25395a;font-size:12px;text-anchor:middle}
      .doc{fill:#FFFFFF;stroke:#4A6FA5;stroke-width:1.2} .doct{fill:#25395a;font-size:12px;text-anchor:middle}
      .term{fill:#CFE6C9;stroke:#6BA36B;stroke-width:1.4} .termt{fill:#254a25;font-size:12.5px;font-weight:600;text-anchor:middle}
      .stop{fill:#F6D9D5;stroke:#C0625A;stroke-width:1.2} .stopt{fill:#7A2E28;font-size:12px;text-anchor:middle}
      .edge{stroke:#4A6FA5;stroke-width:1.6;fill:none}
      .dash{stroke:#8B98AE;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
      .lbl{fill:#4A6FA5;font-size:11px}
      .dlbl{fill:#7C889E;font-size:11px}
      .lgt{fill:#5A6B85;font-size:11.5px}
      .legendbox{fill:#FFFFFF;stroke:#C9D6E8}
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4A6FA5"/></marker>
    <marker id="arrd" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8B98AE"/></marker>
    <!-- 六种图形，中心在 (0,0) -->
    <g id="s-start"><rect class="start" x="-70" y="-20" width="140" height="40" rx="20"/></g>
    <g id="s-step"><rect class="n" x="-110" y="-24" width="220" height="48" rx="6"/></g>
    <g id="s-dec"><path class="dec" d="M0,-36 L100,0 L0,36 L-100,0 Z"/></g>
    <g id="s-state"><path class="doc" d="M-110,-26 H94 L110,-10 V20 Q55,34 0,22 T-110,22 Z"/><path class="doc" d="M94,-26 V-10 H110" fill="none"/></g>
    <g id="s-term"><rect class="term" x="-70" y="-20" width="140" height="40" rx="20"/></g>
    <g id="s-stop"><rect class="stop" x="-100" y="-24" width="200" height="48" rx="6"/></g>
    <!-- 图例条目，左上角在 (0,0)，高 44。外框不在这里，每张图按绘制宽度单独画，类 legendbox -->
    <g id="legend">
      <rect class="start" x="14" y="13" width="30" height="18" rx="9"/><text class="lgt" x="50" y="26">起点</text>
      <rect class="n" x="92" y="13" width="30" height="18" rx="3"/><text class="lgt" x="128" y="26">处理步骤</text>
      <path class="dec" d="M209,13 L226,22 L209,31 L192,22 Z"/><text class="lgt" x="232" y="26">判断</text>
      <path class="doc" d="M274,13 H298 L304,19 V29 Q296,33 289,30 T274,30 Z"/><text class="lgt" x="310" y="26">状态落地点</text>
      <rect class="term" x="388" y="13" width="30" height="18" rx="9"/><text class="lgt" x="424" y="26">成功终点</text>
      <rect class="stop" x="486" y="13" width="30" height="18" rx="3"/><text class="lgt" x="522" y="26">阻断</text>
      <path class="edge" d="M562,22 H596" marker-end="url(#arr)"/><text class="lgt" x="602" y="26">同泳道流转</text>
      <path class="dash" d="M682,22 H716" marker-end="url(#arrd)"/><text class="lgt" x="722" y="26">跨泳道流转</text>
    </g>
  </defs>

  <rect class="bg" x="0" y="0" width="868" height="160"/>
</svg>
